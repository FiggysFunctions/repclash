# =============================================================================
#  Publishes the contents of web/ to GitHub Pages on every push to main.
#  No build step, no dependencies — it just uploads the folder.
#
#  One-time setup: repo → Settings → Pages → Source: "GitHub Actions".
# =============================================================================
name: Deploy RepClash

on:
  push:
    branches: [main]
  workflow_dispatch:        # lets you redeploy by hand from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

# If you push twice quickly, let the newer deploy win rather than queueing.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./web

      - id: deployment
        uses: actions/deploy-pages@v4
